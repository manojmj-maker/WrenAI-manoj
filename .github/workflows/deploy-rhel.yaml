name: Deploy Wren AI to RHEL VM

on:
  workflow_dispatch:
    inputs:
      deploy_path:
        description: 'Target directory on RHEL VM'
        required: false
        default: '~/wrenai'
  push:
    branches:
      - legacy/v1
    paths:
      - 'docker/**'
      - '.github/workflows/deploy-rhel.yaml'

jobs:
  deploy-to-rhel:
    name: Deploy to RHEL VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to RHEL VM using Native OpenSSH
        env:
          RHEL_HOST: ${{ secrets.RHEL_HOST }}
          RHEL_USERNAME: ${{ secrets.RHEL_USERNAME }}
          RHEL_SSH_KEY: ${{ secrets.RHEL_SSH_KEY }}
          RHEL_PORT: ${{ secrets.RHEL_PORT || '22' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USER_UUID: ${{ secrets.USER_UUID }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_DIR: ${{ github.event.inputs.deploy_path || '~/wrenai' }}
        run: |
          set -e
          echo "=== Setting up SSH Key & OpenSSH Client ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client

          mkdir -p ~/.ssh
          echo "$RHEL_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Helper SSH & SCP commands using SSH key authentication
          SSH="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p $RHEL_PORT $RHEL_USERNAME@$RHEL_HOST"
          SCP="scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P $RHEL_PORT"

          echo "=== 1. Creating target directory on RHEL VM ==="
          $SSH "mkdir -p $TARGET_DIR"

          echo "=== 2. Transferring docker/ configuration files, src & vanilla-fastapi-app ==="
          $SCP -r docker/. "$RHEL_USERNAME@$RHEL_HOST:$TARGET_DIR/"
          $SCP -r wren-ai-service/src "$RHEL_USERNAME@$RHEL_HOST:$TARGET_DIR/"
          $SCP -r vanilla-fastapi-app "$RHEL_USERNAME@$RHEL_HOST:$TARGET_DIR/"

          if [ -n "$GCP_SA_KEY" ]; then
            echo "=== Transferring GCP Service Account Key ==="
            (echo "$GCP_SA_KEY" | base64 -w 0 2>/dev/null || echo "$GCP_SA_KEY" | base64) > /tmp/gcp_key.b64
            $SCP /tmp/gcp_key.b64 "$RHEL_USERNAME@$RHEL_HOST:$TARGET_DIR/gcp_key.b64"
            rm -f /tmp/gcp_key.b64
          fi

          echo "=== 3. Executing deployment script on RHEL VM ==="
          $SSH "cd $TARGET_DIR && bash -c '
            set -e

            echo \"=== Checking & Installing Docker Engine ===\"
            if ! command -v docker &> /dev/null; then
              echo \"Installing Docker Engine...\"
              if command -v dnf &> /dev/null; then
                sudo dnf install -y dnf-plugins-core
                sudo dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo || true
                sudo dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin --allowerasing || true
              elif command -v yum &> /dev/null; then
                sudo yum install -y yum-utils
                sudo yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo || true
                sudo yum install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin || true
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq ca-certificates curl gnupg
                sudo curl -fsSL https://get.docker.com | sh
              else
                curl -fsSL https://get.docker.com | sh
              fi
              sudo systemctl enable --now docker || sudo service docker start || true
              sudo usermod -aG docker \"$RHEL_USERNAME\" || true
            fi

            DOCKER_CMD=\"docker\"
            if ! docker info &> /dev/null; then
              DOCKER_CMD=\"sudo docker\"
            fi

            COMPOSE_CMD=\"\$DOCKER_CMD compose\"
            if ! \$DOCKER_CMD compose version &> /dev/null; then
              if command -v docker-compose &> /dev/null; then
                COMPOSE_CMD=\"docker-compose\"
              else
                echo \"=== Installing standalone Docker Compose ===\"
                sudo curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)\" -o /usr/local/bin/docker-compose || true
                sudo chmod +x /usr/local/bin/docker-compose || true
                COMPOSE_CMD=\"/usr/local/bin/docker-compose\"
              fi
            fi

            echo \"=== Setting up environment & configuration ===\"
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                cp .env.example .env
              else
                echo \"Creating default .env with fallback/dummy values...\"
                echo \"OPENAI_API_KEY=sk-dummy-openai-api-key-change-me\" > .env
                echo \"USER_UUID=a1b2c3d4-e5f6-7890-abcd-1234567890ab\" >> .env
              fi
            fi

            if ! grep -q \"^USER_UUID=.\\+\" .env; then
              NEW_UUID=\$(cat /proc/sys/kernel/random/uuid 2>/dev/null || echo \"a1b2c3d4-e5f6-7890-abcd-1234567890ab\")
              sed -i \"s|^USER_UUID=.*|USER_UUID=\${NEW_UUID}|\" .env
            fi

            if [ -n \"$OPENAI_API_KEY\" ]; then
              sed -i \"s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=$OPENAI_API_KEY|\" .env
            fi

            if [ -n \"$USER_UUID\" ]; then
              sed -i \"s|^USER_UUID=.*|USER_UUID=$USER_UUID|\" .env
            fi

            if [ -n \"$GCP_PROJECT_ID\" ]; then
              if grep -q \"^GCP_PROJECT_ID=\" .env; then
                sed -i \"s|^GCP_PROJECT_ID=.*|GCP_PROJECT_ID=$GCP_PROJECT_ID|\" .env
              else
                echo \"GCP_PROJECT_ID=$GCP_PROJECT_ID\" >> .env
              fi
            fi

            if [ -f gcp_key.b64 ]; then
              base64 -d gcp_key.b64 > gcp-key.json
              chmod 644 gcp-key.json
              cp gcp-key.json vanilla-fastapi-app/gcp-key.json 2>/dev/null || true
              rm -f gcp_key.b64
            fi

            if [ ! -f config.yaml ]; then
              cp config.example.yaml config.yaml
            fi

            mkdir -p data

            echo \"=== Adjusting SELinux permissions ===\"
            if command -v getenforce &> /dev/null && [ \"\$(getenforce)\" = \"Enforcing\" ]; then
              sudo chcon -Rt svirt_sandbox_file_t . || true
            fi

            echo \"=== Opening Firewall ports (3000, 5555, 8080) ===\"
            if sudo systemctl is-active --quiet firewalld; then
              sudo firewall-cmd --zone=public --add-port=3000/tcp --permanent || true
              sudo firewall-cmd --zone=public --add-port=5555/tcp --permanent || true
              sudo firewall-cmd --zone=public --add-port=8080/tcp --permanent || true
              sudo firewall-cmd --reload || true
            elif command -v ufw &> /dev/null; then
              sudo ufw allow 3000/tcp || true
              sudo ufw allow 5555/tcp || true
              sudo ufw allow 8080/tcp || true
            fi

            echo \"=== Starting all Wren AI services ===\"
            \$COMPOSE_CMD pull || true
            \$COMPOSE_CMD up -d --remove-orphans

            echo \"=== Deploying Vanilla FastAPI App & Dedicated Collector ===\"
            if [ -d vanilla-fastapi-app ]; then
              cd vanilla-fastapi-app
              \$COMPOSE_CMD up -d --build
              cd ..
            fi

            echo \"=== Verifying service health status ===\"
            MAX_RETRY=30
            RETRY=0
            HEALTHY=false

            while [ \$RETRY -lt \$MAX_RETRY ]; do
              if curl -s http://localhost:3000 > /dev/null; then
                HEALTHY=true
                break
              fi
              echo \"Waiting for Wren UI (port 3000)... (\$((\$RETRY+1))/\$MAX_RETRY)\"
              sleep 5
              RETRY=\$((\$RETRY+1))
            done

            \$COMPOSE_CMD ps

            if [ \"\$HEALTHY\" = true ]; then
              echo \"====================================================\"
              echo \"🎉 SUCCESS: All Wren AI services are live and working!\"
              echo \"Wren UI is accessible at: http://$RHEL_HOST:3000\"
              echo \"====================================================\"
            else
              echo \"⚠️ Warning: Wren UI took longer than expected to respond.\"
              \$COMPOSE_CMD logs --tail=50
              exit 1
            fi
          '"






