apiVersion: v1
kind: ConfigMap
metadata:
  name: wren-config
  namespace: default
data:
  WREN_ENGINE_PORT: "8080"
  WREN_ENGINE_SQL_PORT: "7432"
  WREN_AI_SERVICE_PORT: "5555"
  IBIS_SERVER_PORT: "8000"
  WREN_UI_PORT: "3000"

  WREN_PRODUCT_VERSION: "0.24.1"
  WREN_ENGINE_VERSION: "0.14.8"
  WREN_AI_SERVICE_VERSION: "0.19.7"
  WREN_UI_VERSION: "0.24.1"
  IBIS_SERVER_VERSION: "0.14.8"
  WREN_BOOTSTRAP_VERSION: "0.1.5"

  # In-cluster service endpoints
  WREN_ENGINE_ENDPOINT: "http://wren-engine:8080"
  WREN_AI_ENDPOINT: "http://wren-ai-service:5555"
  IBIS_SERVER_ENDPOINT: "http://wren-ibis-server:8000"
  WREN_UI_ENDPOINT: "http://wren-ui:3000"
  QDRANT_HOST: "wren-qdrant"

  # Database settings (SQLite with persistent volume for effortless zero-maintenance storage)
  WREN_UI_DB_TYPE: "sqlite"
  SQLITE_FILE: "/app/data/db.sqlite3"
  WREN_ENGINE_DATA_PATH: "/app/data"

  # LLM and logging
  GENERATION_MODEL: "gpt-4o-mini-2024-07-18"
  LOGGING_LEVEL: "INFO"
  TELEMETRY_ENABLED: "false"

  # OpenTelemetry Common Config
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wren-ai-service-config
  namespace: default
data:
  config.yaml: |
    type: llm
    provider: litellm_llm
    timeout: 120
    models:
    - alias: default
      model: gpt-4o-mini
      context_window_size: 128000
      kwargs:
        max_tokens: 4096
        n: 1
        seed: 0
        temperature: 0
    ---
    type: embedder
    provider: litellm_embedder
    models:
    - model: text-embedding-3-small
      alias: default
      timeout: 120
    ---
    type: engine
    provider: wren_ui
    endpoint: http://wren-ui:3000
    ---
    type: engine
    provider: wren_ibis
    endpoint: http://wren-ibis-server:8000
    ---
    type: document_store
    provider: qdrant
    location: http://wren-qdrant:6333
    embedding_model_dim: 1536
    timeout: 120
    ---
    type: pipeline
    pipes:
      - name: db_schema_indexing
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: historical_question_indexing
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: table_description_indexing
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: db_schema_retrieval
        llm: litellm_llm.default
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: historical_question_retrieval
        embedder: litellm_embedder.default
        document_store: qdrant
      - name: sql_generation
        llm: litellm_llm.default
        engine: wren_ui
        document_store: qdrant
      - name: sql_correction
        llm: litellm_llm.default
        engine: wren_ui
        document_store: qdrant
      - name: followup_sql_generation
        llm: litellm_llm.default
        engine: wren_ui
        document_store: qdrant
      - name: sql_answer
        llm: litellm_llm.default
      - name: chart_generation
        llm: litellm_llm.default
      - name: sql_question_generation
        llm: litellm_llm.default
    ---
    settings:
      doc_endpoint: https://docs.getwren.ai
      is_oss: true
      engine_timeout: 30
      allow_intent_classification: true
      logging_level: INFO
      development: false
---
apiVersion: v1
kind: Secret
metadata:
  name: wrenai-secrets
  namespace: default
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  USER_UUID: "wrenai-gke-user"
  POSTHOG_API_KEY: ""
  POSTHOG_HOST: "https://app.posthog.com"
