apiVersion: apps/v1
kind: Deployment
metadata:
  name: wren-ai-service
  namespace: default
  labels:
    app: wren-ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wren-ai-service
  template:
    metadata:
      labels:
        app: wren-ai-service
    spec:
      containers:
        - name: wren-ai-service
          image: ghcr.io/canner/wren-ai-service:0.19.7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --quiet --no-cache-dir opentelemetry-distro opentelemetry-exporter-otlp opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-logging && \
              opentelemetry-bootstrap -a install && \
              opentelemetry-instrument uvicorn src.__main__:app --host 0.0.0.0 --port 5555
          volumeMounts:
            - name: config-volume
              mountPath: /app/data
          env:
            - name: WREN_AI_SERVICE_PORT
              value: "5555"
            - name: QDRANT_HOST
              value: "wren-qdrant"
            - name: LOGGING_LEVEL
              value: "INFO"
            - name: WREN_UI_ENDPOINT
              value: "http://wren-ui:3000"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CONFIG_PATH
              value: "/app/data/config.yaml"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wrenai-secrets
                  key: OPENAI_API_KEY
            # OpenTelemetry Auto-Instrumentation & Export Config
            - name: OTEL_SERVICE_NAME
              value: "wren-ai-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
          ports:
            - containerPort: 5555
              name: http
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: config-volume
          configMap:
            name: wren-ai-service-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: wren-ai-service
  namespace: default
spec:
  selector:
    app: wren-ai-service
  ports:
    - protocol: TCP
      port: 5555
      targetPort: 5555
      name: http
