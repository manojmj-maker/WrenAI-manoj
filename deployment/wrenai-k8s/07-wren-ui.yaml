apiVersion: apps/v1
kind: Deployment
metadata:
  name: wren-ui
  namespace: default
  labels:
    app: wren-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wren-ui
  template:
    metadata:
      labels:
        app: wren-ui
    spec:
      volumes:
        - name: wren-ui-data
          persistentVolumeClaim:
            claimName: wren-data-pvc
      containers:
        - name: wren-ui
          image: ghcr.io/canner/wren-ui:0.24.1
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: wren-ui-data
              mountPath: /app/data
          env:
            - name: DB_TYPE
              value: "sqlite"
            - name: SQLITE_FILE
              value: "/app/data/db.sqlite3"
            - name: WREN_ENGINE_ENDPOINT
              value: "http://wren-engine:8080"
            - name: WREN_AI_ENDPOINT
              value: "http://wren-ai-service:5555"
            - name: IBIS_SERVER_ENDPOINT
              value: "http://wren-ibis-server:8000"
            - name: GENERATION_MODEL
              value: "gpt-4o-mini-2024-07-18"
            - name: WREN_PRODUCT_VERSION
              value: "0.24.1"
            - name: WREN_ENGINE_VERSION
              value: "0.14.8"
            - name: WREN_AI_SERVICE_VERSION
              value: "0.19.7"
            - name: WREN_UI_VERSION
              value: "0.24.1"
            - name: USER_UUID
              value: "wrenai-gke-user"
            - name: TELEMETRY_ENABLED
              value: "false"
            # OpenTelemetry Auto-Instrumentation & Export Config
            - name: OTEL_SERVICE_NAME
              value: "wren-ui"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
          ports:
            - containerPort: 3000
              name: http
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wren-ui
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: wren-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      name: http
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http-direct
