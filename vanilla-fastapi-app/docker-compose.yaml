version: "3.8"

services:
  # 1. Manual / In-Code Instrumented App (Port 8080)
  vanilla-fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanilla-fastapi-app
    restart: on-failure
    ports:
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}

  # 2. Zero-Code Auto-Instrumented App (Port 8081)
  zero-code-fastapi-app:
    build:
      context: ./zero-code-app
      dockerfile: Dockerfile
    container_name: zero-code-fastapi-app
    restart: on-failure
    ports:
      - "8081:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OTEL_SERVICE_NAME=zero-code-fastapi-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
